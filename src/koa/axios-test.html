<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0" />
  <title>vue@2 element-ui demo</title>

  <!-- import element-ui css -->
  <link rel="stylesheet"
    href="https://unpkg.com/element-ui/lib/theme-chalk/index.css" />

  <!-- import vue@2 -->
  <script src="https://unpkg.com/vue@2"></script>
  <!-- import element-ui component library -->
  <script src="https://unpkg.com/element-ui/lib/index.js"></script>
  <script src="https://unpkg.com/axios@1"></script>

  <style></style>
</head>

<body>
  <div id="app">
    {{message}}
    <el-button @click="handleClickThan">.then .catch</el-button>
    <el-button @click="handleClickTry">try catch</el-button>
  </div>

  <script>
    new Vue({
      el: '#app',
      data: {
        message: 'Hello Vue@2 Element UI!',
      },
      methods: {
        handleClickThan() {
          const params = {
            name: '你好 then catch',
          }
          axios.post(`/test`, params, {
            baseURL: 'http://localhost:3000/api',
          }).then((response) => {
            console.log(`response=>`, response)
            this.message = response.data.message
          }).catch((error) => {
            console.error(`error=>`, error)
            this.message = 'Error occurred!'
          })
        },
        async handleClickTry() {
          const params = {
            name: '你好 try catch',
          }
          try {
            const response = await axios.post(`/test`, params, {
              baseURL: 'http://localhost:3000/api',
            })
            this.message = response.data.message
          } catch (error) {
            console.error(`error=>`, error)
            this.message = 'Error occurred!'
          }
        },
      },
    })
  </script>
</body>

</html>
